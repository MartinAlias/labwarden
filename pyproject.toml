[project]
name = "labwarden"
version = "0.1.0"
description = "A read-only AI network & security engineer for your homelab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "paramiko>=3.4",
    "dnspython>=2.6",
    "mcp>=1.10",
]

[project.scripts]
labwarden = "labwarden.cli:app"

# Third-party collector plugins register themselves here:
#   [project.entry-points."labwarden.collectors"]
#   myvendor = "my_package.collector:MyVendorCollector"
[project.entry-points."labwarden.collectors"]
discovery = "labwarden.collectors.discovery:DiscoveryCollector"
docker = "labwarden.collectors.docker:DockerCollector"
linux_ssh = "labwarden.collectors.linux_ssh:LinuxSshCollector"
manual = "labwarden.collectors.manual:ManualCollector"
pihole = "labwarden.collectors.pihole:PiholeCollector"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labwarden"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
