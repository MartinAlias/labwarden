# LabWarden configuration.
# Copy to the repo root (or anywhere) as labwarden.yaml and adjust.
# Strings may reference environment variables: ${NAME} or ${NAME:-default}.
# A .env file next to this config is loaded automatically. Keep secrets there.

# Where snapshots and generated docs are stored (relative to this file).
data_dir: data

targets:
  # Facts that can't be discovered automatically: hardware, purpose, cabling.
  - name: inventory
    plugin: manual
    options:
      file: inventory.yaml

  # Pi-hole v6. Use an *app password* (Settings > Web interface / API) and keep
  # webserver.api.app_sudo off, so the credential can't change settings.
  # - name: pihole
  #   plugin: pihole
  #   options:
  #     url: http://192.168.1.2          # scheme://host[:port], no /admin path
  #     password: ${PIHOLE_PASSWORD}     # put PIHOLE_PASSWORD=... in .env
  #     # verify_tls: false              # only for https:// with the self-signed cert
  #
  # Docker, read through tecnativa/docker-socket-proxy (CONTAINERS=1 NETWORKS=1
  # POST=0). LabWarden never touches /var/run/docker.sock itself.
  # - name: docker-server
  #   plugin: docker
  #   options:
  #     url: tcp://192.168.1.10:2375   # the proxy, not the Docker socket
